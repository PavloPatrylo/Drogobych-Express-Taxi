services:
  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-drogobych_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-drogobych_pass_2026}
      POSTGRES_DB: ${DB_NAME:-drogobych_express_prod_db}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-drogobych_admin} -d ${DB_NAME:-drogobych_express_prod_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME:-paulpatrylo}/drogobych-taxi-backend:${DOCKER_IMAGE_TAG:-latest}
    container_name: taxi-backend-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: ${DOCKER_USERNAME:-paulpatrylo}/drogobych-taxi-frontend:${DOCKER_IMAGE_TAG:-latest}
    container_name: taxi-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: taxi-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend

volumes:
  pg_data_prod:
  certbot_certs:
