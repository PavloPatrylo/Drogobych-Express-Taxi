services:
  # 1. Захищена база даних PostgreSQL (без портів назовні)
  postgres:
    image: postgres:16-alpine
    container_name: drogobych_express_db_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Захищений FastAPI бекенд (з вбудованим healthcheck на /health)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drogobych_express_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Веб-Адмінка (React / Vite Admin Dashboard)
  frontend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.frontend
    container_name: drogobych_express_frontend_prod
    restart: unless-stopped
    networks:
      - frontend_network
    depends_on:
      backend:
        condition: service_healthy

  # 4. Єдина зовнішня точка входу в Продакшні — Nginx Reverse Proxy (Порти 80 та 443 з SSL)
  nginx:
    image: nginx:1.27-alpine
    container_name: drogobych_express_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - frontend_network
      - backend_network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
