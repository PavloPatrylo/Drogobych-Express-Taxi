<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Taxi Mini App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900 pb-10">
    <div class="bg-yellow-400 p-6 rounded-b-3xl text-black shadow-lg">
        <div class="flex items-center space-x-4">
            <div id="user-avatar" class="w-16 h-16 bg-black/10 rounded-full flex items-center justify-center text-2xl font-bold border-2 border-black/20">--</div>
            <div>
                <h1 id="user-name" class="text-xl font-bold">Завантаження...</h1>
                <p id="user-role" class="text-black/60 text-sm font-medium">Отримання даних...</p>
            </div>
        </div>
        <div class="mt-4 flex justify-center bg-black/5 p-3 rounded-xl text-sm font-bold border border-black/10">
            <span id="user-trips">🚕 Поїздок: ...</span>
        </div>
    </div>

    <div class="flex justify-around p-4 bg-white shadow-sm mt-2 sticky top-0 z-10">
        <button id="nav-search" class="text-yellow-600 font-bold border-b-2 border-yellow-500 pb-1 w-1/2">Пошук</button>
        <button id="nav-trips" class="text-gray-400 font-bold border-b-2 border-transparent pb-1 w-1/2">Мої квитки</button>
    </div>

    <div id="view-search" class="p-4 space-y-4 block">
        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3 border border-gray-100">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Звідки:</label>
                <select id="from-select" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium outline-none focus:border-yellow-400">
                    <option value="">Завантаження міст...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Куди:</label>
                <select id="to-select" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium outline-none focus:border-yellow-400">
                    <option value="">Завантаження міст...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Дата поїздки:</label>
                <input type="date" id="travel-date" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium outline-none focus:border-yellow-400">
            </div>
            <button id="search-btn" class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl shadow-sm transition-colors mt-2">
                Знайти рейс
            </button>
        </div>
        <div id="results-container" class="space-y-4"></div>
    </div>

    <div id="view-trips" class="p-4 space-y-4 hidden">
        <h2 class="font-bold text-lg text-gray-700 mb-2">Активні квитки</h2>
        <div id="active-tickets-container" class="space-y-4">
            </div>

        <h2 class="font-bold text-lg text-gray-700 mt-6 mb-2">Історія поїздок</h2>
        <div id="history-tickets-container" class="space-y-4 opacity-75">
            </div>
    </div>

    <script src="app.js?v1"></script>
</body>
</html>
