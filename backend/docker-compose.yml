services:
  # 1. Сервіс бази даних PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: drogobych_express_db_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Сервіс FastAPI бекенду
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drogobych_express_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    networks:
      - backend_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Сервіс Веб-Адмінки (React / Vite Admin Dashboard)
  frontend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.frontend
    container_name: drogobych_express_frontend_dev
    restart: unless-stopped
    networks:
      - frontend_network
    depends_on:
      backend:
        condition: service_healthy

  # 4. Внутрішній Nginx Reverse Proxy (Порт 80)
  nginx:
    image: nginx:1.27-alpine
    container_name: drogobych_express_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_network
      - backend_network
    depends_on:
      - backend
      - frontend

  # 5. Ngrok тунель для локального тестування Telegram Mini App (HTTPS -> Nginx:80)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: drogobych_express_ngrok_dev
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN:-fletcher-inordinate-leontine.ngrok-free.dev}"
      - "nginx:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    networks:
      - frontend_network
      - backend_network
    depends_on:
      - nginx

volumes:
  postgres_data:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
