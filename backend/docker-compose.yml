services:
  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-drogobych_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-drogobych_pass_2026}
      POSTGRES_DB: ${DB_NAME:-drogobych_express_db}
    ports:
      - "5433:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-drogobych_admin} -d ${DB_NAME:-drogobych_express_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxi-backend-local
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data_local:
