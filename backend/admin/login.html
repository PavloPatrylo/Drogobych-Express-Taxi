<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | Адмін-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Golos Text', sans-serif;
            background: #0f1117;
            color: #e8ecf4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #181c27;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2a3045;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #f5c518; margin-bottom: 24px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #1e2333;
            border: 1px solid #2a3045;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #f5c518;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f5c518;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        button:hover { background: #e8a000; }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Експрес Таксі</h1>
        <div id="error-message" class="error-msg">Невірний телефон або пароль</div>
        
        <form onsubmit="handleLogin(event)">
            <input type="tel" id="phone" placeholder="Номер телефону (+380...)" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" id="submit-btn">Увійти</button>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const btn = document.getElementById('submit-btn');

            errorMsg.style.display = 'none';
            btn.textContent = 'Зачекайте...';
            btn.disabled = true;

            try {
                // Стандартний OAuth2 запит для FastAPI (вимагає application/x-www-form-urlencoded)
                const response = await fetch('/api/admin/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    // У FastAPI OAuth2PasswordRequestForm завжди чекає поле 'username', 
                    // тому ми передаємо наш телефон у поле username
                    body: new URLSearchParams({
                        'username': phone,
                        'password': password
                    })
                });

                if (!response.ok) {
                    throw new Error('Невірні дані');
                }

                const data = await response.json();
                
                // Зберігаємо JWT токен у браузері
                localStorage.setItem('admin_token', data.access_token);
                
                // Перенаправляємо на головну сторінку адмінки (заміни на свою назву файлу, якщо треба)
                window.location.href = 'index.html'; 
                
            } catch (error) {
                errorMsg.style.display = 'block';
                btn.textContent = 'Увійти';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
