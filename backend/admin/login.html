<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | Адмін-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Golos Text', sans-serif;
            background: #0f1117;
            color: #e8ecf4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #181c27;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2a3045;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { color: #f5c518; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            background: #1e2333;
            border: 1px solid #2a3045;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f5c518;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #e8a000; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Admin Login</h1>
        <form onsubmit="handleLogin(event)">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            // Temporary simple redirect until real auth is implemented
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
